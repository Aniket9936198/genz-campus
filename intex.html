<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GENZ CAMPUS</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f0e6;color:#382417}
header{padding:22px 7%;background:#fffaf2;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:27px;font-weight:900;letter-spacing:-1px}
.logo span{color:#9b6845}
nav a{margin-left:18px;color:#543b2c;text-decoration:none;font-weight:bold}
.hero{padding:65px 8%;background:#e9d8c3;text-align:center}
.hero h1{font-size:48px;margin:0 0 12px}
.hero p{font-size:17px}
button{background:#573b2b;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}
section{padding:35px 7%}
input,select{padding:12px;border:1px solid #cbb69e;border-radius:8px;background:#fffaf2}
.search{width:100%;margin:12px 0}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px;margin-top:22px}
.card{background:#fffaf2;padding:16px;border-radius:14px;box-shadow:0 3px 12px #5a3c2815}
.card .emoji{font-size:48px;background:#eee2d3;text-align:center;padding:20px;border-radius:10px}
.card h3{margin-bottom:5px}
.price{font-weight:bold;color:#805333}
#sell{background:#eadbc9;border-radius:14px}
#sell input,#sell select{width:100%;margin:7px 0}
footer{text-align:center;background:#382417;color:#fff3e5;padding:25px}
</style>
</head>
<body>

<header>
<div class="logo">GENZ <span>CAMPUS.</span></div>
<nav>
<a href="#home">Home</a>
<a href="#buy">Buy</a>
<a href="#sell">Sell</a>
</nav>
</header>

<div class="hero" id="home">
<h1>Your Campus. Your Market.</h1>
<p>Buy, Sell & Connect with your college community.</p>
<button onclick="document.getElementById('buy').scrollIntoView()">Explore Products</button>
</div>

<section id="buy">
<h2>Explore Marketplace</h2>
<input class="search" id="search" placeholder="Search books, notes, stationery..." oninput="showProducts()">
<div class="filters">
<select id="category" onchange="showProducts()">
<option value="All">All Categories</option>
<option>Books</option>
<option>Notes</option>
<option>Stationery</option>
<option>Electronics</option>
</select>
</div>
<div class="products" id="products"></div>
</section>

<section id="sell">
<h2>Sell Your Item</h2>
<p>List your college products in a few seconds.</p>
<input id="name" placeholder="Product name">
<input id="price" type="number" placeholder="Price (₹)">
<select id="type">
<option>Books</option>
<option>Notes</option>
<option>Stationery</option>
<option>Electronics</option>
</select>
<button onclick="addProduct()">List Product</button>
<p id="message"></p>
</section>

<footer>
<h3>GENZ CAMPUS</h3>
<p>BUY • SELL • CONNECT</p>
<p>Made for Students ❤️</p>
</footer>

<script>
let items=[
{name:"Engineering Mathematics",price:250,type:"Books",emoji:"📚"},
{name:"Physics Notes",price:100,type:"Notes",emoji:"📒"},
{name:"Study Stationery Kit",price:150,type:"Stationery",emoji:"✏️"},
{name:"Scientific Calculator",price:400,type:"Electronics",emoji:"🖩"}
];

function showProducts(){
let search=document.getElementById("search").value.toLowerCase();
let category=document.getElementById("category").value;
let filtered=items.filter(p=>
p.name.toLowerCase().includes(search)&&
(category==="All"||p.type===category)
);
document.getElementById("products").innerHTML=
filtered.map(p=>`
<div class="card">
<div class="emoji">${p.emoji||"🛍️"}</div>
<h3>${p.name}</h3>
<p>${p.type}</p>
<p class="price">₹${p.price}</p>
<button onclick="alert('Demo listing: contact and checkout will be added later.')">View Item</button>
</div>`).join("")||"<p>No products found.</p>";
}

function addProduct(){
let name=document.getElementById("name").value.trim();
let price=Number(document.getElementById("price").value);
let type=document.getElementById("type").value;
if(!name||price<=0){
alert("Enter a product name and valid price.");
return;
}
items.push({name,price,type,emoji:"🛍️"});
showProducts();
document.getElementById("message").innerText="Product added successfully!";
document.getElementById("name").value="";
document.getElementById("price").value="";
}
showProducts();
</script>
</body>
</html>
